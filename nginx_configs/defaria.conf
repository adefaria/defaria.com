# Nginx server configuration for defaria.com / earth.defariahome.com

# ----------------------------------------------------------------------------
# Defaria.com (Cloud / Production)
# Proxies /yt/ YouTube downloader requests to earth.defariahome.com
# ----------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name defaria.com www.defaria.com;
    root /web; # /web is a symlink to /opt/defaria.com
    index index.php index.html;
    autoindex on;

    # YouTube Downloader Reverse Proxy to Home Server (Earth)
    location ^~ /yt/ {
        proxy_pass https://earth.defariahome.com/yt/;
        proxy_set_header Host earth.defariahome.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    include /opt/defaria.com/nginx_configs/defaria_common.conf;
}

server {
    listen 443 ssl default_server;
    server_name defaria.com www.defaria.com;
    root /web;
    index index.php index.html;
    autoindex on;

    ssl_certificate /etc/letsencrypt/live/defaria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/defaria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # YouTube Downloader Reverse Proxy to Home Server (Earth)
    location ^~ /yt/ {
        proxy_pass https://earth.defariahome.com/yt/;
        proxy_set_header Host earth.defariahome.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    include /opt/defaria.com/nginx_configs/defaria_common.conf;
}

# ----------------------------------------------------------------------------
# Earth.defariahome.com (Home Server - Serves /yt/ locally)
# ----------------------------------------------------------------------------
server {
    listen 80;
    server_name earth.defariahome.com localhost;
    root /web;
    index index.php index.html;
    autoindex on;

    include /opt/defaria.com/nginx_configs/defaria_common.conf;
}

server {
    listen 443 ssl;
    server_name earth.defariahome.com localhost;
    root /web;
    index index.php index.html;
    autoindex on;

    ssl_certificate /etc/letsencrypt/live/defaria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/defaria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    include /opt/defaria.com/nginx_configs/defaria_common.conf;
}
