# Nginx server configuration for defaria.com / earth.defariahome.com

# HTTP Server (Staging and Production HTTP)
server {
    listen 80 default_server; # Port 80 for HTTP

    server_name defaria.com earth.defariahome.com;
    root /web; # /web is a symlink to /opt/defaria.com
    index index.php index.html;

    # Redirect /upload to main site
    rewrite ^/upload$ https://defaria.com/#upload permanent;

    # Custom 404 Error page
    error_page 404 /404.php;

    # Main Website Clean URLs
    location / {
        try_files $uri $uri/ @clean_url;
    }

    location @clean_url {
        # Check if bypass=true query parameter is present
        if ($arg_bypass = "true") {
            return 404;
        }
        # Check if path starts with excluded folders
        if ($uri ~* "^/(css|Icons|Images|JavaScript|php|bin|gitweb|sounds|video|upload)/") {
            return 404;
        }
        rewrite ^/(.*)$ /index.php?url=$1 last;
    }

    # Main Website PHP files
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Custom PHP include path equivalent to Apache .htaccess php_value include_path
        fastcgi_param PHP_VALUE "include_path=.:/opt/defaria.com/php:/opt/clearscm/maps/php:/opt/clearscm/web/php:/usr/share/php";
        # Allow long running tasks like youtube download
        fastcgi_read_timeout 600s;
    }

    # ------------------------------------------------------------------------
    # MAPS (Mail Authorization and Permission System)
    # ------------------------------------------------------------------------
    location /maps/ {
        alias /opt/clearscm/maps/;
        index index.php index.html;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param PHP_VALUE "include_path=.:/opt/defaria.com/php:/opt/clearscm/maps/php:/opt/clearscm/lib:/usr/share/php";
        }

        location ~ \.cgi$ {
            gzip off;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            # Translate PerlSwitches include path using PERL5LIB env variable
            fastcgi_param PERL5LIB "/opt/clearscm/maps/lib:/opt/clearscm/lib";
        }
    }

    # ------------------------------------------------------------------------
    # Songbook
    # ------------------------------------------------------------------------
    location /songbook/ {
        alias /opt/songbook/web/;
        index index.php index.html;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        location ~ \.cgi$ {
            gzip off;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location /Music/ {
        alias /opt/songbook/Music/;
        autoindex on; # Equivalent to Apache Options Indexes
    }

    # ------------------------------------------------------------------------
    # Gitweb
    # ------------------------------------------------------------------------
    location /gitweb/ {
        alias /usr/share/gitweb/;
        index gitweb.cgi;

        location ~ \.cgi$ {
            gzip off;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }
}

