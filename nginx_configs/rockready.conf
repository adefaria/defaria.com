# Nginx server configuration for RockReady (WordPress)

# HTTP Server (Staging and Production HTTP)
server {
    listen 80; # Port 80 for HTTP

    server_name rockready.defariahome.com rockready.band;
    root /opt/rockready;
    index index.php index.html;

    # Redirect HTTP to HTTPS in production (uncomment when running HTTPS)
    # return 301 https://$host$request_uri;

    # WordPress Permalinks / Clean URLs
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP Execution
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}

