<IfModule mod_ssl.c>
<VirtualHost *:443>
  # RockReady
  ServerName rockready.band
  DocumentRoot "/opt/rockready"

  <Directory "/opt/rockready">
    Options Indexes FollowSymLinks MultiViews ExecCGI Includes
    AllowOverride All
    Require all granted
  </Directory>


Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/rockready.band/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/rockready.band/privkey.pem
</VirtualHost>
</IfModule>
