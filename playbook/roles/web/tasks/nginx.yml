---
- name: Install Nginx, PHP-FPM, and fcgiwrap (RedHat/CentOS)
  yum: name={{item}} state=latest
  with_items:
   - gitweb
   - nginx
   - php-fpm
   - fcgiwrap
  when: ansible_pkg_mgr == "yum"

- name: Install Nginx, PHP-FPM, and fcgiwrap (Debian/Ubuntu)
  apt: name={{item}} state=latest update_cache=yes
  with_items:
   - gitweb
   - nginx
   - php8.4-fpm
   - fcgiwrap
  when: ansible_pkg_mgr == "apt"

- name: Create Let's Encrypt directories
  file: path=/etc/letsencrypt/live/defaria.com recurse=true

- name: Template Nginx configurations (Debian/Ubuntu)
  template:
    src: "{{item.src}}"
    dest: "/etc/nginx/sites-available/{{item.dest}}"
  with_items:
    - {src: 'defaria.conf.j2', dest: 'defaria.conf'}
    - {src: 'rockready.conf.j2', dest: 'rockready.conf'}
  when: ansible_os_family == "Debian"
  notify: Restart nginx

- name: Enable Nginx configurations (Debian/Ubuntu)
  file:
    src: "/etc/nginx/sites-available/{{item}}"
    dest: "/etc/nginx/sites-enabled/{{item}}"
    state: link
  with_items:
    - defaria.conf
    - rockready.conf
  when: ansible_os_family == "Debian"
  notify: Restart nginx

- name: Remove default Nginx site link (Debian/Ubuntu)
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: ansible_os_family == "Debian"
  notify: Restart nginx

- name: Template Nginx configurations (RedHat/CentOS)
  template:
    src: "{{item.src}}"
    dest: "/etc/nginx/conf.d/{{item.dest}}"
  with_items:
    - {src: 'defaria.conf.j2', dest: 'defaria.conf'}
    - {src: 'rockready.conf.j2', dest: 'rockready.conf'}
  when: ansible_os_family == "RedHat"
  notify: Restart nginx

- stat: path=/var/www/html
  register: links

- name: Remove /var/www/html
  file:
    path: /var/www/html
    state: absent
  when:
    links.stat.islnk == False

- name: Configure symlinks
  file: src={{item.src}} dest={{item.dest}} state=link
  with_items:
    - {src: /opt/defaria.com, dest: '/var/www/html'}
    - {src: /opt/defaria.com, dest: '/web'}
  notify: Restart nginx

- name: Stop Apache (httpd)
  service: name={{item}} state=stopped enabled=no
  with_items:
    - apache2
    - httpd
  ignore_errors: true

- name: Enable Nginx, PHP-FPM, and fcgiwrap services
  service: name={{item}} state=started enabled=yes
  with_items:
    - nginx
    - "{{ php_fpm_service | default('php8.4-fpm') }}"
    - fcgiwrap
  ignore_errors: true
